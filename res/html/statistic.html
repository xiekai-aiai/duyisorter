<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MyEchart</title>
</head>
<body>
    <!--  图表容器DOM -->
    <div id="main" style="min-height:400px"></div>
    <!-- 单文件引入ECharts -->
    <script src="asset/js/echarts-all.js"></script>
    <script type="text/javascript">
    // 基于准备好的dom，初始化echarts图表
    var myChart;
    var option = {
        title : {
            text: '',
        },
        tooltip : {
            show : true,
            trigger : 'axis'
        },
        color : ['#FF0000', '#00FF00', '#0000FF', '#800000', '#008000', '#000080'],
        legend : {
            data : []
        },
        toolbox : {
            show : true,
            feature : {
                dataView : {show: true, readOnly: false},
                magicType : {show: true, type: ['line', 'bar']},
                restore : {show: true},
            }
        },
        calculable : false,
        xAxis : [
            {
                type : 'category',
                boundaryGap : true,
                axisLabel : {
                    interval : function(index) {
				   var len = option.xAxis[0].data.length;
				   var step = 50;
				   if (len <= 100) {
				       step = 10;
				   } else if (len <= 300) {
				       step = 50;
				   } else {
				       step = 200;
				   }
				   if (index%step == 0) {
                                       return true;
				   } else {
                                       return false;
				   }
                               }
                },
                axisTick : {
                    show : true,
                    interval : function(index) {
			var len = option.xAxis[0].data.length;
			var step = 10;
			if (len <= 100) {
			    step = 1;
			} else if (len <= 300) {
			    step = 10;
			} else {
			    step = 40;
			}
			if (index%step == 0) {
                            return true;
			} else {
                            return false;
			}
                    }
                },
                data : []
            }
        ],
        yAxis : [
            {
                type : 'value',
                /*
                min  : 0,
                max  : 255,
                axisLabel : {
                    interval : function(index, data) {
                        if (data[index]%50 == 0)
                            return true;
                        else
                            return false;
                    },
                    formatter : '{value}'
                }
		*/
            }
        ],
        series : []
    };

    // 加载echart数据
    window.setTimeout(function(){
        var obj = {
	    range : 2048,
	    data : {
		data : [],
	    }
        }
        refreshData(JSON.stringify(obj));
    }, 100);

    // 刷新坐标
    function refreshAxis(str) {
        // parse json
        var obj = JSON.parse(str);
        
        // set xAxis data
        var max = obj.max;
        if (option.xAxis[0].data.length != max) {
            var xAxis = [];
	    var yAxis = [];
            for(var i = 0; i < max; i++) {
                xAxis.push(i);
            }
	    option.xAxis[0].data = xAxis;
        }
    }

    // 刷新数据
    function refreshData(str) {
        // parse json
        var obj = JSON.parse(str);

		// set title
		var title = 'level - '+obj.level+' unit - '+obj.unit;
		option.title.text = title;

	// data range
	var xAxis = [];
	var yAxis = [];
	for (var i = 0; i < obj.range; i++) {
	    xAxis.push(i);
	    yAxis.push(0);
	}
	option.xAxis[0].data = xAxis;

	// data list
	var list = obj.data;

        // set series
	option.legend.data = [];
	option.series = [];
        for (x in list) {
	  var arr = list[x].length > 0 ? list[x] : yAxis;
          var series = {
            name: x,
            type: obj.type,
            symbol: 'none',
            data: arr 
          }
          option.legend.data.push(x);
          option.series.push(series);
        }
        refreshChart();
    }

    // 刷新图表
    function refreshChart() {
        if (myChart) {
            myChart.clear();
            myChart.dispose();
        }
        myChart = echarts.init(document.getElementById('main'), 'default');
        // 自动调整窗口大小
        window.onresize = myChart.resize;
        myChart.setOption(option, notMerge = false);
    }
    </script>
</body>
</html>
