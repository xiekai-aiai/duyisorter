<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色选机深度学习训练工作站</title>
<style>
/* SECTION: base */
:root{
  --bg:#050a14; --bg2:#081120;
  --panel:rgba(12,22,38,.78); --panel2:rgba(9,17,30,.9);
  --line:rgba(56,189,248,.16); --line2:rgba(56,189,248,.32);
  --cyan:#22d3ee; --cyan2:#67e8f9; --blue:#3b82f6;
  --green:#34d399; --red:#f87171; --amber:#fbbf24;
  --txt:#e2edfb; --dim:#7d93b2; --dim2:#54687f;
  --mono:"Consolas","SF Mono","JetBrains Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  overflow:hidden; font-size:14px;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 500px at 78% -10%, rgba(34,211,238,.10), transparent 60%),
    radial-gradient(900px 500px at 8% 110%, rgba(59,130,246,.10), transparent 60%),
    repeating-linear-gradient(0deg, rgba(56,189,248,.035) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(56,189,248,.035) 0 1px, transparent 1px 44px);
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 2px, transparent 2px 4px);
}
#app{position:relative; z-index:2; height:100%; display:flex; flex-direction:column; gap:10px; padding:12px 14px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* SECTION: panel-frame */
.frame{
  position:relative; background:var(--panel); border:1px solid var(--line);
  backdrop-filter:blur(8px); border-radius:10px;
}
.frame::before,.frame::after{
  content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  border-color:var(--line2); border-style:solid; opacity:.9;
}
.frame::before{top:-1px; left:-1px; border-width:2px 0 0 2px; border-radius:10px 0 0 0}
.frame::after{bottom:-1px; right:-1px; border-width:0 2px 2px 0; border-radius:0 0 10px 0}

/* SECTION: header */
header{display:flex; align-items:center; gap:16px; padding:10px 16px; flex:none}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo{
  width:38px; height:38px; flex:none; border-radius:9px; position:relative;
  background:linear-gradient(135deg, rgba(34,211,238,.25), rgba(59,130,246,.15));
  border:1px solid var(--line2); display:grid; place-items:center;
  box-shadow:0 0 18px rgba(34,211,238,.25) inset, 0 0 12px rgba(34,211,238,.15);
}
.logo svg{width:22px; height:22px}
.brand h1{font-size:17px; font-weight:600; letter-spacing:1px; white-space:nowrap}
.brand h1 b{color:var(--cyan2); font-weight:700}
.brand p{font-size:11px; color:var(--dim); letter-spacing:2.5px; margin-top:2px; white-space:nowrap}
.h-spacer{flex:1}
.cls-group{display:flex; gap:8px; align-items:center}
.cls-chip{
  display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
  padding:7px 14px; border-radius:8px; border:1px solid var(--line);
  background:rgba(255,255,255,.02); transition:.18s; font-size:13px;
}
.cls-chip i{width:12px; height:12px; border-radius:3px; flex:none}
.cls-chip[data-cls="0"] i{background:var(--green); box-shadow:0 0 8px var(--green)}
.cls-chip[data-cls="1"] i{background:var(--red); box-shadow:0 0 8px var(--red)}
.cls-chip .num{font-weight:700; font-size:15px}
.cls-chip[data-cls="0"] .num{color:var(--green)}
.cls-chip[data-cls="1"] .num{color:var(--red)}
.cls-chip.active{border-color:var(--line2); background:rgba(34,211,238,.10); box-shadow:0 0 14px rgba(34,211,238,.18)}
.status{display:flex; flex-direction:column; gap:3px; align-items:flex-end; padding-right:4px}
.status .row{display:flex; gap:8px; align-items:center; font-size:11px; color:var(--dim)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.status .time{font-size:13px; color:var(--cyan2)}
.h-actions{display:flex; gap:10px}

/* SECTION: buttons */
.btn{
  cursor:pointer; border:1px solid var(--line); border-radius:8px; color:var(--txt);
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  padding:9px 16px; font-size:13px; letter-spacing:1px; transition:.16s; font-family:inherit;
  display:inline-flex; align-items:center; gap:7px; justify-content:center; white-space:nowrap;
}
.btn:hover{border-color:var(--line2); background:rgba(34,211,238,.10); color:var(--cyan2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn-primary{
  border-color:rgba(34,211,238,.55); color:#031318; font-weight:700;
  background:linear-gradient(135deg, #22d3ee, #3b82f6);
  box-shadow:0 0 16px rgba(34,211,238,.35), 0 0 30px rgba(59,130,246,.18);
}
.btn-primary:hover{color:#031318; filter:brightness(1.12); background:linear-gradient(135deg,#22d3ee,#3b82f6)}
.btn-danger:hover{border-color:rgba(248,113,113,.6); background:rgba(248,113,113,.12); color:var(--red)}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:7px}
.btn.on{border-color:var(--cyan); color:var(--cyan2); background:rgba(34,211,238,.16); box-shadow:0 0 12px rgba(34,211,238,.25) inset}

/* SECTION: body layout */
main{flex:1; display:flex; gap:10px; min-height:0}
.stage-col{flex:1; display:flex; flex-direction:column; gap:10px; min-width:0}
.stage{flex:1; min-height:0; position:relative; overflow:hidden; display:grid; place-items:center; padding:14px}
.canvas-wrap{position:relative; width:100%; height:100%; max-width:100%; display:grid; place-items:center}
.canvas-box{position:relative; aspect-ratio:16/10; max-width:100%; max-height:100%; width:auto; height:100%; border:1px solid var(--line2); border-radius:8px; overflow:hidden; box-shadow:0 0 40px rgba(34,211,238,.10), 0 10px 40px rgba(0,0,0,.5); background:#0b1017}
.canvas-box canvas{position:absolute; inset:0; width:100%; height:100%}
#maskCanvas{touch-action:none; cursor:crosshair}
.empty-state{position:absolute; inset:0; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; background:rgba(6,11,20,.72); z-index:3}
.empty-state .ring{width:74px; height:74px; border-radius:50%; border:1px dashed var(--line2); display:grid; place-items:center; animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state .ring svg{width:32px; height:32px; animation:spin 14s linear infinite reverse}
.empty-state h3{font-size:16px; letter-spacing:3px; color:var(--cyan2)}
.empty-state p{font-size:12px; color:var(--dim); letter-spacing:1px}
.hidden{display:none !important}

/* SECTION: canvas tools */
.tool-rail{position:absolute; left:24px; top:50%; transform:translateY(-50%); z-index:4; display:flex; flex-direction:column; gap:8px}
.tool-rail .btn{writing-mode:horizontal-tb; padding:9px 12px; background:var(--panel2); backdrop-filter:blur(6px)}
.brush-bar{position:absolute; left:50%; bottom:24px; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel2); backdrop-filter:blur(8px); border:1px solid var(--line); border-radius:999px}
.brush-bar .sep{width:1px; height:20px; background:var(--line)}
.brush-bar label{font-size:12px; color:var(--dim); display:flex; align-items:center; gap:8px}
input[type=range]{accent-color:var(--cyan); width:90px; cursor:pointer}
.prog-chip{position:absolute; right:24px; top:24px; z-index:4; padding:8px 16px; border-radius:8px; background:var(--panel2); border:1px solid var(--line); backdrop-filter:blur(6px); font-size:13px; color:var(--dim)}
.prog-chip b{color:var(--cyan2); font-size:16px}
.popover{position:absolute; z-index:6; width:250px; padding:14px 16px; background:var(--panel2); border:1px solid var(--line2); border-radius:10px; backdrop-filter:blur(10px); box-shadow:0 12px 40px rgba(0,0,0,.55)}
.popover h4{font-size:13px; color:var(--cyan2); letter-spacing:2px; margin-bottom:10px}
.popover .frow{display:flex; justify-content:space-between; align-items:center; gap:10px; margin:9px 0; font-size:12px; color:var(--dim)}
.popover .frow .num{color:var(--txt); min-width:38px; text-align:right}

/* SECTION: resource panel */
.res-col{width:330px; flex:none; display:flex; flex-direction:column; min-height:0}
.res-head{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.res-head h2{font-size:14px; letter-spacing:2px; flex:1}
.res-head h2 span{color:var(--dim2); font-size:11px; letter-spacing:1px; margin-left:6px}
.count-badge{padding:4px 12px; border-radius:999px; border:1px solid var(--line2); color:var(--cyan2); font-size:13px; background:rgba(34,211,238,.08)}
.res-tools{padding:10px 12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; border-bottom:1px solid var(--line)}
.res-list{flex:1; overflow-y:auto; padding:12px; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start}
.res-list::-webkit-scrollbar{width:6px}
.res-list::-webkit-scrollbar-thumb{background:rgba(56,189,248,.25); border-radius:3px}
.res-card{position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; background:#0b1017; transition:.16s}
.res-card:hover{border-color:var(--line2); transform:translateY(-2px)}
.res-card.current{border-color:var(--cyan); box-shadow:0 0 14px rgba(34,211,238,.3)}
.res-card img{width:100%; aspect-ratio:16/10; object-fit:cover; display:block}
.res-card .meta{padding:6px 8px; display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim)}
.res-card .meta .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--txt)}
.res-card .tag{padding:1px 6px; border-radius:4px; font-size:10px; border:1px solid}
.res-card .tag.ok{color:var(--green); border-color:rgba(52,211,153,.5)}
.res-card .tag.no{color:var(--dim2); border-color:var(--line)}
.res-card .chk{position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:4px; border:1px solid var(--line2); background:rgba(5,10,20,.7); display:grid; place-items:center; font-size:12px; color:transparent}
.res-card.sel .chk{background:var(--cyan); color:#031318; border-color:var(--cyan)}
.res-empty{grid-column:1/-1; padding:40px 10px; text-align:center; color:var(--dim2); font-size:12px; letter-spacing:2px; border:1px dashed var(--line); border-radius:8px}
.res-foot{padding:10px 12px; border-top:1px solid var(--line); display:flex; align-items:center; gap:8px}
.res-foot .pg{flex:1; text-align:center; font-size:12px; color:var(--dim)}

/* SECTION: dock */
footer{flex:none; padding:10px 14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
footer .grp{display:flex; gap:8px; flex-wrap:wrap}
footer .vsep{width:1px; align-self:stretch; background:var(--line); margin:0 6px}
footer .grow{flex:1}

/* SECTION: modal */
.modal-backdrop{position:fixed; inset:0; z-index:50; background:rgba(3,7,14,.72); backdrop-filter:blur(4px); display:grid; place-items:center; padding:20px}
.modal{width:min(680px,100%); max-height:86vh; display:flex; flex-direction:column; background:var(--panel2); border:1px solid var(--line2); border-radius:12px; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 40px rgba(34,211,238,.08)}
.modal.wide{width:min(860px,100%)}
.modal-head{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.modal-head h3{flex:1; font-size:15px; letter-spacing:2px; color:var(--cyan2)}
.modal-head .x{cursor:pointer; color:var(--dim); font-size:18px; width:28px; height:28px; display:grid; place-items:center; border-radius:6px; border:1px solid transparent}
.modal-head .x:hover{color:var(--red); border-color:rgba(248,113,113,.4)}
.modal-body{padding:18px; overflow-y:auto}
.modal-foot{padding:12px 18px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px; letter-spacing:1px}
.field input[type=text]{width:100%; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:7px; padding:9px 12px; color:var(--txt); font-size:14px; font-family:inherit; outline:none}
.field input[type=text]:focus{border-color:var(--cyan)}
table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th{text-align:left; color:var(--dim); font-weight:500; font-size:11px; letter-spacing:1.5px; padding:8px 10px; border-bottom:1px solid var(--line2)}
table.tbl td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--txt)}
.pill{padding:2px 9px; border-radius:999px; font-size:11px; border:1px solid}
.pill.g{color:var(--green); border-color:rgba(52,211,153,.5); background:rgba(52,211,153,.08)}
.pill.c{color:var(--cyan2); border-color:var(--line2); background:rgba(34,211,238,.08)}
.pill.a{color:var(--amber); border-color:rgba(251,191,36,.5); background:rgba(251,191,36,.08)}
.pill.r{color:var(--red); border-color:rgba(248,113,113,.5); background:rgba(248,113,113,.08)}
.train-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.metric{border:1px solid var(--line); border-radius:9px; padding:12px 14px; background:rgba(255,255,255,.02)}
.metric .k{font-size:11px; color:var(--dim); letter-spacing:2px}
.metric .v{font-size:24px; color:var(--cyan2); margin-top:4px}
.metric .v.g{color:var(--green)}
.bar{height:6px; border-radius:3px; background:rgba(255,255,255,.06); overflow:hidden; margin-top:10px}
.bar i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--blue)); box-shadow:0 0 10px var(--cyan); transition:width .25s}
#lossChart{width:100%; height:170px; border:1px solid var(--line); border-radius:8px; background:rgba(0,0,0,.25); margin-top:14px}
.logbox{margin-top:12px; height:110px; overflow-y:auto; background:rgba(0,0,0,.35); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-family:var(--mono); font-size:11.5px; color:var(--dim); line-height:1.75}
.logbox .t{color:var(--dim2)}
.logbox .ok{color:var(--green)}
.logbox .hi{color:var(--cyan2)}
.sim-wrap{position:relative; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.sim-wrap canvas{width:100%; display:block}

/* SECTION: model manager */
.mgr-view{position:fixed; inset:0; z-index:45; background:rgba(3,7,14,.82); backdrop-filter:blur(6px); display:grid; place-items:center; padding:22px}
.mgr-panel{width:min(1080px,100%); height:min(780px,92vh); display:flex; flex-direction:column; background:var(--panel2); border:1px solid var(--line2); border-radius:14px; box-shadow:0 30px 90px rgba(0,0,0,.65), 0 0 50px rgba(34,211,238,.08); overflow:hidden}
.mgr-panel .modal-head{background:linear-gradient(90deg, rgba(34,211,238,.10), transparent 55%)}
.mgr-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:14px 18px; border-bottom:1px solid var(--line)}
.mgr-stats .metric{padding:10px 14px}
.mgr-stats .metric .v{font-size:20px}
.mgr-list{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:10px}
.mgr-list::-webkit-scrollbar{width:6px}
.mgr-list::-webkit-scrollbar-thumb{background:rgba(56,189,248,.25); border-radius:3px}
.mgr-row{display:grid; grid-template-columns:1.7fr .7fr .7fr .7fr .9fr .8fr; gap:12px; align-items:center; padding:12px 16px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:rgba(255,255,255,.02); transition:.15s}
.mgr-row:hover{border-color:var(--line2); background:rgba(34,211,238,.04)}
.mgr-row.sel{border-color:var(--cyan); background:rgba(34,211,238,.09); box-shadow:0 0 18px rgba(34,211,238,.16) inset, 0 0 14px rgba(34,211,238,.18)}
.mgr-row .nm{font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mgr-row .sub{font-size:11px; color:var(--dim); margin-top:3px; letter-spacing:.5px}
.mgr-row .cell .k{font-size:10px; color:var(--dim2); letter-spacing:1.5px}
.mgr-row .cell .v{font-size:14px; margin-top:2px}
.mgr-row .selmark{font-size:11px; color:var(--dim2); text-align:right; letter-spacing:1px}
.mgr-row.sel .selmark{color:var(--cyan2)}
.mgr-empty{padding:60px 10px; text-align:center; color:var(--dim2); font-size:13px; letter-spacing:3px; border:1px dashed var(--line); border-radius:10px}
.mgr-foot{padding:14px 18px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); gap:10px; background:rgba(0,0,0,.22)}
.mgr-foot .btn{padding:11px 10px; letter-spacing:2px}
@media (max-width:820px){
  .mgr-stats{grid-template-columns:repeat(2,1fr)}
  .mgr-row{grid-template-columns:1fr 1fr; row-gap:8px}
  .mgr-row .selmark{text-align:left}
  .mgr-foot{grid-template-columns:repeat(2,1fr)}
}

/* SECTION: classic HMI */
body.mode-classic .cls-group, body.mode-classic #hDl{display:none}
body:not(.mode-classic) #dockClassic{display:none}
body.mode-classic #dockDL{display:none}
#modeSeg{display:flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; flex:none}
#modeSeg .seg{padding:7px 14px; font-size:12px; letter-spacing:2px; color:var(--dim); background:transparent; border:0; cursor:pointer}
#modeSeg .seg.active{color:#04121c; background:linear-gradient(135deg,var(--cyan),var(--blue)); font-weight:700}
.top-acts{display:flex; gap:8px; flex:none}
.ws{display:none; flex:1; min-height:0; gap:10px}
.ws.active{display:flex}
.ws-classic{flex-direction:column}
.cs-rail{display:flex; gap:8px; align-items:center; padding:8px 10px; flex:none; overflow-x:auto}
.cs-rail .btn.on{border-color:var(--cyan); color:var(--cyan2); box-shadow:inset 0 0 14px rgba(34,211,238,.22)}
.cs-body{flex:1; min-height:0; display:flex; gap:10px}
.cs-side{width:136px; flex:none; display:flex; flex-direction:column; gap:6px; padding:10px 8px; overflow-y:auto}
.cs-side .sbtn{display:flex; flex-direction:column; align-items:center; gap:7px; padding:11px 4px; border:1px solid transparent; border-radius:9px; background:transparent; color:var(--dim); cursor:pointer; font-size:12px; letter-spacing:1px}
.cs-side .sbtn svg{width:22px; height:22px}
.cs-side .sbtn.on{color:var(--cyan2); border-color:var(--line2); background:rgba(34,211,238,.08); box-shadow:0 0 12px rgba(34,211,238,.12)}
.cs-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; padding:14px; overflow-y:auto}
.cs-tabs{display:flex; gap:6px; flex:none}
.cs-tabs .tb{padding:8px 24px; font-size:13px; letter-spacing:2px; color:var(--dim); background:var(--panel2); border:1px solid var(--line); border-bottom-color:transparent; border-radius:9px 9px 0 0; cursor:pointer}
.cs-tabs .tb.on{color:var(--cyan2); background:rgba(34,211,238,.10); border-color:var(--line2); box-shadow:0 -2px 16px rgba(34,211,238,.14)}
.cs-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px}
.kv{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 14px; background:var(--panel2); border:1px solid var(--line); border-radius:9px}
.kv .k{font-size:13px; color:var(--dim); letter-spacing:1px}
.kv .v{font-size:15px; color:var(--txt)}
.inp{width:150px; padding:7px 10px; background:rgba(4,12,22,.72); border:1px solid var(--line2); border-radius:7px; color:var(--cyan2); font-family:var(--mono); font-size:14px; text-align:right}
.inp.wide{width:100%}
.inp:focus{outline:none; border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.25)}
.stepper{display:flex; align-items:center; gap:8px}
.stepper .stp{width:30px; height:30px; border-radius:7px; border:1px solid var(--line2); background:rgba(34,211,238,.08); color:var(--cyan2); font-size:16px; line-height:1; cursor:pointer}
.stepper .stp:hover{background:rgba(34,211,238,.2)}
.chk{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none; font-size:14px; color:var(--txt)}
.chk i{width:22px; height:22px; border-radius:6px; border:1px solid var(--line2); background:rgba(4,12,22,.6); position:relative; flex:none}
.chk.on i{background:linear-gradient(135deg,var(--cyan),var(--blue)); border-color:var(--cyan)}
.chk.on i::after{content:""; position:absolute; left:7px; top:3px; width:6px; height:11px; border:solid #04121c; border-width:0 2px 2px 0; transform:rotate(42deg)}
.seg2{display:flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; flex:none}
.seg2 button{padding:7px 18px; font-size:13px; color:var(--dim); background:transparent; border:0; cursor:pointer}
.seg2 button.on{color:#04121c; background:linear-gradient(135deg,var(--cyan),var(--blue)); font-weight:700}
.sliderow{display:flex; align-items:center; gap:12px; width:100%}
.sliderow input[type=range]{flex:1; accent-color:var(--cyan)}
.nozzles{display:grid; grid-template-columns:repeat(auto-fill,minmax(24px,1fr)); gap:6px}
.nz{height:26px; border-radius:5px; border:1px solid var(--line); background:rgba(9,17,30,.8); cursor:pointer}
.nz.fire{background:linear-gradient(180deg,var(--cyan),var(--blue)); box-shadow:0 0 10px rgba(34,211,238,.6); border-color:var(--cyan)}
.nz.cur{outline:2px solid var(--amber)}
.matgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.matcell{border:1px solid var(--line); border-radius:9px; background:var(--panel2); overflow:hidden; cursor:pointer}
.matcell .ph{height:112px; display:flex; align-items:center; justify-content:center; color:var(--dim2); font-size:12px; letter-spacing:2px; background:repeating-linear-gradient(45deg, rgba(56,189,248,.045) 0 8px, transparent 8px 16px)}
.matcell img{width:100%; height:112px; object-fit:cover; display:block}
.matcell .lb{padding:6px; text-align:center; font-size:12px; color:var(--dim); border-top:1px solid var(--line)}
.matcell.sel{border-color:var(--cyan); box-shadow:0 0 14px rgba(34,211,238,.25)}
.curvebox{position:relative; height:230px; border:1px solid var(--line); border-radius:9px; background:rgba(4,10,20,.72); overflow:hidden}
.curvebox canvas{width:100%; height:100%}
.boot{position:fixed; inset:0; z-index:60; background:radial-gradient(900px 520px at 50% 38%, rgba(10,25,45,.97), rgba(3,7,14,.995)); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px}
.boot .ring2{width:118px; height:118px; border-radius:50%; border:2px solid rgba(34,211,238,.14); border-top-color:var(--cyan); animation:spin 1.1s linear infinite; position:relative}
.boot .ring2::after{content:""; position:absolute; inset:15px; border-radius:50%; border:1px solid rgba(59,130,246,.2); border-bottom-color:var(--blue); animation:spin 1.7s linear reverse infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot h2{letter-spacing:7px; font-size:20px; color:var(--cyan2)}
.boot p{font-size:12px; color:var(--dim); letter-spacing:3px}
.boot .steps{display:flex; flex-direction:column; gap:8px; width:330px}
.boot .st{display:flex; justify-content:space-between; font-size:12px; color:var(--dim2); letter-spacing:1px}
.boot .st.done{color:var(--green)}
.boot .st.doing{color:var(--cyan)}
.camgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.camgrid .cam{border:1px solid var(--line); border-radius:9px; overflow:hidden; position:relative; background:#04080f}
.camgrid .cam canvas{width:100%; height:150px; display:block}
.camgrid .cam .tag{position:absolute; left:8px; top:8px; font-size:11px; letter-spacing:1px; color:var(--cyan2); background:rgba(4,10,20,.7); border:1px solid var(--line2); border-radius:5px; padding:2px 8px}

/* SECTION: toast */
#toasts{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; align-items:center}
.toast{padding:10px 20px; border-radius:8px; background:var(--panel2); border:1px solid var(--line2); color:var(--txt); font-size:13px; letter-spacing:1px; box-shadow:0 8px 30px rgba(0,0,0,.5); animation:tin .25s ease; display:flex; gap:9px; align-items:center}
.toast.ok{border-color:rgba(52,211,153,.6)} .toast.ok::before{content:"✓"; color:var(--green)}
.toast.err{border-color:rgba(248,113,113,.6)} .toast.err::before{content:"!"; color:var(--red)}
.toast.info::before{content:"◆"; color:var(--cyan)}
@keyframes tin{from{opacity:0; transform:translateY(-10px)}}

/* SECTION: responsive */
@media (max-width:1080px){
  body{overflow:auto}
  #app{height:auto; min-height:100%}
  main{flex-direction:column}
  .res-col{width:100%}
  .res-list{max-height:300px}
  .stage{min-height:420px}
  header{flex-wrap:wrap}
  .status{display:none}
}
</style>

<div id="app">

      </div>

  <!-- SECTION: main -->
  <main id="wsDL" class="ws active">
    <div class="stage-col">
      <div class="stage frame">
        <div class="canvas-wrap">
          <div class="canvas-box" id="canvasBox">
            <canvas id="baseCanvas" width="960" height="600"></canvas>
            <canvas id="maskCanvas" width="960" height="600"></canvas>

            <h3>请先选择图片！</h3>

          </div>

          <div class="brush-bar" id="brushBar">
            <button class="btn btn-sm" id="btnEdit">开始标注</button>
            <span class="sep"></span>
            <button class="btn btn-sm on" id="btnBrushPaint" data-tool="annotate">标注</button>
            <button class="btn btn-sm" id="btnBrushErase" data-tool="erase">擦除</button>
            <span class="sep"></span>
            <label>笔刷 <input type="range" id="brushSize" min="6" max="60" value="20"><span class="num" id="brushVal">20</span></label>
          </div>
          <div class="popover hidden" id="popHue" style="left:86px; top:50%; transform:translateY(-70%)">
            <h4>颜色阈值</h4>
            <div class="frow"><span>色调容差 H</span><input type="range" id="thH" min="0" max="180" value="32"><span class="num" id="thHv">32</span></div>
            <div class="frow"><span>饱和度下限 S</span><input type="range" id="thS" min="0" max="100" value="40"><span class="num" id="thSv">40</span></div>
            <div class="frow"><span>明度下限 V</span><input type="range" id="thV" min="0" max="100" value="25"><span class="num" id="thVv">25</span></div>
          </div>
          <div class="popover hidden" id="popArea" style="left:86px; top:50%; transform:translateY(-30%)">
            <h4>目标面积</h4>
            <div class="frow"><span>最小面积 px</span><input type="range" id="thAmin" min="4" max="200" value="12"><span class="num" id="thAminv">12</span></div>
            <div class="frow"><span>最大面积 px</span><input type="range" id="thAmax" min="200" max="2000" value="400"><span class="num" id="thAmaxv">400</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SECTION: resource panel -->
    <aside class="res-col frame">
      <div class="res-head">

      <div class="res-foot">

  </main>

  <!-- SECTION: classic workspace -->
  <main id="wsClassic" class="ws ws-classic">
    <nav class="cs-rail frame" id="csRail">
      <button class="btn btn-sm" data-cs="scheme">方案选择</button>

  <!-- SECTION: dock -->
  <footer class="frame">

    </div>
    <div class="grp" id="dockClassic" style="display:none">

      <button class="btn" id="ckProd">测试产量</button>
      <button class="btn" id="ckLang">语言设定</button>
      <button class="btn" id="ckInfo2">设备信息</button>
    </div>
    <span class="vsep"></span>
    <div class="grp">
      <button class="btn" id="btnBack">返回</button>
    </div>
    <span class="grow"></span>
    <span style="font-size:11px; color:var(--dim2); letter-spacing:2px" id="dockVer">DL-CONSOLE v3.2 · EDGE RUNTIME</span>
  </footer>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>

<script>
/* SECTION: state */
const S = {
  resources: [], page: 0, pageSize: 8, currentId: null,
  cls: 1, tool: 'annotate', editing: false, brush: 20,
  models: [
    {name:'CSNet-v2.3', epochs:120, acc:98.6, miou:94.2, date:'2026-09-10', status:'使用中'},
    {name:'CSNet-v2.1', epochs:100, acc:97.2, miou:91.8, date:'2026-08-02', status:'已归档'},
  ],
  currentModel:'CSNet-v2.3',
  th:{h:32, s:40, v:25, amin:12, amax:400},
  seq: 0, training:false,
};
const $ = s => document.querySelector(s);
const baseC = $('#baseCanvas'), maskC = $('#maskCanvas');
const bctx = baseC.getContext('2d'), mctx = maskC.getContext('2d');
const CLS_COLOR = {0:'52,211,153', 1:'248,113,113'};

/* SECTION: utils */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300)}, 2600);
}
function clock(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  $('#clock').textContent = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
clock(); setInterval(clock, 1000);

/* SECTION: synthetic image */
function genGrains(seed){
  const rnd = mulberry32(seed); const grains = [];
  const n = 64 + Math.floor(rnd()*26);
  const normals = ['#e6d7ae','#d9c68f','#efe3c0','#e0cf9d'];
  const defects = ['#8a5a2b','#6b3f2a','#a3762e','#54371f'];
  for(let i=0;i<n;i++){
    const defect = rnd() < 0.13;
    grains.push({
      x: 40 + rnd()*880, y: 40 + rnd()*520,
      rx: 11 + rnd()*7, ry: 7 + rnd()*5, rot: rnd()*Math.PI,
      c: defect ? defects[Math.floor(rnd()*defects.length)] : normals[Math.floor(rnd()*normals.length)],
      defect
    });
  }
  return grains;
}
function drawBase(ctx, grains){
  const g = ctx.createLinearGradient(0,0,0,600);
  g.addColorStop(0,'#141c28'); g.addColorStop(1,'#0a0f16');
  ctx.fillStyle = g; ctx.fillRect(0,0,960,600);
  ctx.strokeStyle = 'rgba(56,189,248,.06)'; ctx.lineWidth = 1;
  for(let y=0;y<600;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(960,y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  ctx.beginPath(); ctx.moveTo(0,300); ctx.lineTo(960,300); ctx.stroke();
  for(const gr of grains){
    ctx.save(); ctx.translate(gr.x, gr.y); ctx.rotate(gr.rot);
    ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
    ctx.fillStyle = gr.c;
    ctx.beginPath(); ctx.ellipse(0,0,gr.rx,gr.ry,0,0,Math.PI*2); ctx.fill();
    ctx.shadowColor='transparent';
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(-gr.rx*.28,-gr.ry*.3,gr.rx*.42,gr.ry*.36,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  const v = ctx.createRadialGradient(480,300,240,480,300,640);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle = v; ctx.fillRect(0,0,960,600);
}
function makeResource(name){
  const seed = (Math.random()*1e9)|0;
  const grains = genGrains(seed);
  const off = document.createElement('canvas'); off.width=960; off.height=600;
  drawBase(off.getContext('2d'), grains);
  const th = document.createElement('canvas'); th.width=192; th.height=120;
  th.getContext('2d').drawImage(off,0,0,192,120);
  const mask = document.createElement('canvas'); mask.width=960; mask.height=600;
  S.seq++;
  return { id:'r'+S.seq, name, seed, grains, thumb:th.toDataURL('image/png'), mask, annotated:false, sel:false,
           defects: grains.filter(g=>g.defect).length };
}

/* SECTION: list render */
function cur(){ return S.resources.find(r=>r.id===S.currentId) || null; }
function renderList(){
  const list = $('#resList'); list.innerHTML = '';
  const pages = Math.max(1, Math.ceil(S.resources.length / S.pageSize));
  if(S.page >= pages) S.page = pages - 1;
  $('#pgInfo').textContent = `${S.page+1} / ${pages}`;
  $('#resCount').textContent = S.resources.length;
  $('#progAll').textContent = S.resources.length;
  $('#progNow').textContent = S.resources.filter(r=>r.annotated).length;
  if(!S.resources.length){
    list.innerHTML = '<div class="res-empty">暂无训练资源<br>点击「导入图片资源」开始</div>'; return;
  }
  const slice = S.resources.slice(S.page*S.pageSize, S.page*S.pageSize + S.pageSize);
  for(const r of slice){
    const card = document.createElement('div');
    card.className = 'res-card' + (r.id===S.currentId?' current':'') + (r.sel?' sel':'');
    card.innerHTML = `<img alt="${r.name}" data-image="">
      <div class="chk">✓</div>
      <div class="meta"><span class="nm">${r.name}</span>
      <span class="tag ${r.annotated?'ok':'no'}">${r.annotated?'已标注':'未标注'}</span></div>`;
    const imgEl = card.querySelector('img');
    imgEl.dataset.image = r.thumb;
    imgEl.src = imgEl.dataset.image;
    imgEl.addEventListener('error', ()=>{ imgEl.style.display='none'; });
    imgEl.addEventListener('click', ()=>loadResource(r.id));
    card.querySelector('.chk').addEventListener('click', e=>{ e.stopPropagation(); r.sel=!r.sel; renderList(); });
    card.addEventListener('click', e=>{ if(e.target.closest('.chk')) return; loadResource(r.id); });
    list.appendChild(card);
  }
}

/* SECTION: canvas */
function loadResource(id){
  const r = S.resources.find(x=>x.id===id); if(!r) return;
  S.currentId = id;
  drawBase(bctx, r.grains);
  mctx.clearRect(0,0,960,600);
  mctx.drawImage(r.mask,0,0);
  $('#emptyState').classList.add('hidden');
  renderList();
}
function syncMask(){ const r = cur(); if(!r) return;
  r.mask.getContext('2d').clearRect(0,0,960,600);
  r.mask.getContext('2d').drawImage(maskC,0,0);
}
function markAnnotated(){ const r = cur(); if(r && !r.annotated){ r.annotated = true; }
  $('#progNow').textContent = S.resources.filter(x=>x.annotated).length; renderList(); }

let drawing = false, last = null;
function pos(e){ const rect = maskC.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*960/rect.width, y:(e.clientY-rect.top)*600/rect.height }; }
function stroke(ctx, a, b){
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth = S.brush;
  if(S.tool==='erase'){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='#000'; }
  else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=`rgba(${CLS_COLOR[S.cls]},.55)`; }
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
}
maskC.addEventListener('pointerdown', e=>{
  if(!S.editing){ toast('请先点击「开始标注」进入标注模式','err'); return; }
  if(!cur()){ toast('请先选择图片！','err'); return; }
  drawing = true; last = pos(e); maskC.setPointerCapture(e.pointerId);
  stroke(mctx, last, {x:last.x+.01,y:last.y+.01}); syncMask(); markAnnotated();
});
maskC.addEventListener('pointermove', e=>{ if(!drawing) return; const p = pos(e); stroke(mctx,last,p); last=p; syncMask(); });
maskC.addEventListener('pointerup', ()=>{ drawing=false; });

/* SECTION: toolbar events */
$('#clsGroup').addEventListener('click', e=>{
  const chip = e.target.closest('.cls-chip'); if(!chip) return;
  S.cls = +chip.dataset.cls;
  document.querySelectorAll('.cls-chip').forEach(c=>c.classList.toggle('active', c===chip));
  toast(`当前标注类别：${S.cls}（${S.cls===0?'合格':'异物'}）`,'info');
});
$('#btnEdit').addEventListener('click', ()=>{
  S.editing = !S.editing;
  $('#btnEdit').classList.toggle('on', S.editing);
  $('#btnEdit').textContent = S.editing ? '标注中 · 点击退出' : '开始标注';
  maskC.style.cursor = S.editing ? 'crosshair' : 'default';
  toast(S.editing ? '已进入标注模式，可在画布上拖动绘制掩膜' : '已退出标注模式', 'info');
});
function setTool(t){ S.tool = t;
  $('#btnBrushPaint').classList.toggle('on', t==='annotate');
  $('#btnBrushErase').classList.toggle('on', t==='erase'); }
$('#btnBrushPaint').addEventListener('click', ()=>setTool('annotate'));
$('#btnBrushErase').addEventListener('click', ()=>setTool('erase'));
$('#brushSize').addEventListener('input', e=>{ S.brush = +e.target.value; $('#brushVal').textContent = S.brush; });

function bindRange(id, vid, key){ const el=$(id);
  el.addEventListener('input', ()=>{ S.th[key]=+el.value; $(vid).textContent=el.value; }); }

function togglePop(id){ const el=$(id); const was = el.classList.contains('hidden');
  $('#popHue').classList.add('hidden'); $('#popArea').classList.add('hidden');
  if(was) el.classList.remove('hidden'); }
$('#btnHue').addEventListener('click', ()=>togglePop('#popHue'));
$('#btnArea').addEventListener('click', ()=>togglePop('#popArea'));
$('#btnAuto').addEventListener('click', ()=>{
  const r = cur();
  if(!r){ toast('请先选择图片！','err'); return; }
  const targets = S.cls===1 ? r.grains.filter(g=>g.defect) : r.grains.filter(g=>!g.defect && g.x%3<1);
  if(!targets.length){ toast('当前阈值下未检测到目标','err'); return; }
  const ctx = mctx; ctx.save(); ctx.fillStyle = `rgba(${CLS_COLOR[S.cls]},.55)`;
  for(const g of targets){ if(g.rx*g.ry < S.th.amin || g.rx*g.ry > S.th.amax) continue;
    ctx.beginPath(); ctx.ellipse(g.x,g.y,g.rx+4,g.ry+4,g.rot,0,Math.PI*2); ctx.fill(); }
  ctx.restore(); syncMask(); markAnnotated();
  toast(`一键标注完成：类别 ${S.cls} 共 ${targets.length} 个目标`,'ok');
});

/* SECTION: modal infra */
function openModal(title, bodyHTML, buttons, wide){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop"><div class="modal ${wide?'wide':''} frame">
    <div class="modal-head"><h3>${title}</h3><span class="x" data-close>✕</span></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="modal-foot">${(buttons||[{t:'关闭'}]).map((b,i)=>`<button class="btn ${b.primary?'btn-primary':''} ${b.danger?'btn-danger':''}" data-bi="${i}">${b.t}</button>`).join('')}</div>
  </div></div>`;
  const bd = root.firstElementChild;
  bd.addEventListener('click', e=>{
    if(e.target===bd || e.target.closest('[data-close]')){ root.innerHTML=''; return; }
    const bi = e.target.closest('[data-bi]'); if(!bi) return;
    const b = (buttons||[{t:'关闭'}])[+bi.dataset.bi];
    if(b && b.fn){ if(b.fn()===false) return; }
    root.innerHTML='';
  });
  return bd;
}

/* SECTION: training */
$('#btnTrain').addEventListener('click', ()=>{
  const annotated = S.resources.filter(r=>r.annotated);
  if(!annotated.length){ toast('没有已标注的资源，请先完成标注','err'); return; }
  if(S.training) return;
  const bd = openModal('模型训练 · ' + S.currentModel, `
    <div class="train-grid">
      <div class="metric"><div class="k">训练样本</div><div class="v num">${annotated.length}</div></div>
      <div class="metric"><div class="k">当前 EPOCH</div><div class="v num" id="trEpoch">0 / 30</div></div>
      <div class="metric"><div class="k">LOSS</div><div class="v num" id="trLoss">--</div></div>
      <div class="metric"><div class="k">验证精度 mAP</div><div class="v g num" id="trAcc">--</div></div>
    </div>
    <div class="bar"><i id="trBar"></i></div>
    <canvas id="lossChart" width="640" height="170"></canvas>
    <div class="logbox" id="trLog"></div>`,
    [{t:'后台运行并关闭'},{t:'停止训练', danger:true, fn:()=>{ S.training=false; toast('训练已停止','info'); }}], true);
  S.training = true;
  let epoch = 0; const losses = [];
  const log = m=>{ const el = bd.querySelector('#trLog');
    el.innerHTML += `<div><span class="t">[${new Date().toLocaleTimeString()}]</span> ${m}</div>`; el.scrollTop = 1e6; };
  log(`<span class="hi">初始化训练器 · 数据集 ${annotated.length} 张 · 类别 2</span>`);
  log('加载预训练权重 CSNet-backbone.pth … <span class="ok">OK</span>');
  const chart = bd.querySelector('#lossChart'), cctx = chart.getContext('2d');
  const timer = setInterval(()=>{
    if(!S.training){ clearInterval(timer); return; }
    epoch++;
    const loss = 2.4*Math.exp(-epoch/9) + 0.12 + Math.random()*0.05;
    losses.push(loss);
    if(bd.isConnected){
      bd.querySelector('#trEpoch').textContent = `${epoch} / 30`;
      bd.querySelector('#trLoss').textContent = loss.toFixed(4);
      bd.querySelector('#trAcc').textContent = (88 + 11*(1-Math.exp(-epoch/10)) + Math.random()*.4).toFixed(1) + '%';
      bd.querySelector('#trBar').style.width = (epoch/30*100) + '%';
      cctx.clearRect(0,0,640,170);
      cctx.strokeStyle='rgba(56,189,248,.15)';
      for(let i=1;i<4;i++){ cctx.beginPath(); cctx.moveTo(0,170*i/4); cctx.lineTo(640,170*i/4); cctx.stroke(); }
      cctx.strokeStyle='#22d3ee'; cctx.lineWidth=2; cctx.shadowColor='#22d3ee'; cctx.shadowBlur=8;
      cctx.beginPath();
      losses.forEach((l,i)=>{ const x=i/(29)*620+10, y=160-(l/2.6)*150; i?cctx.lineTo(x,y):cctx.moveTo(x,y); });
      cctx.stroke(); cctx.shadowBlur=0;
    }
    if(epoch % 5 === 0) log(`epoch ${epoch} · loss ${loss.toFixed(4)} · lr ${(1e-3*Math.pow(.9,epoch/5)).toExponential(1)}`);
    if(epoch >= 30){
      clearInterval(timer); S.training = false;
      const acc = (96 + Math.random()*3).toFixed(1);
      log(`<span class="ok">训练完成 · mAP ${acc}% · 权重已保存至 /models/${S.currentModel}.pth</span>`);
      S.models.unshift({name:S.currentModel, epochs:30, acc:+acc, miou:+(acc-3.4).toFixed(1), date:new Date().toISOString().slice(0,10), status:'待部署'});
      toast(`训练完成，mAP ${acc}%，模型已更新`,'ok');
    }
  }, 260);
});

/* SECTION: dock modals */
function openSimFor(modelName){
  const r = cur();
  const bd = openModal('模型仿真 · ' + modelName, `
    <p style="font-size:12px;color:var(--dim);margin-bottom:10px">以当前模型对选中图片执行推理，输出检测框与置信度。</p>
    <div class="sim-wrap"><canvas id="simCanvas" width="960" height="600"></canvas></div>
    <div id="simInfo" style="margin-top:10px;font-size:12px;color:var(--dim)"></div>`,
    [{t:'关闭'},{t:'重新推理', primary:true, fn:()=>{ runSim(bd); return false; }}], true);
  runSim(bd);
  function runSim(bd){
    const cv = bd.querySelector('#simCanvas'), ctx = cv.getContext('2d');
    if(!r){ ctx.clearRect(0,0,960,600); ctx.fillStyle='#0b1017'; ctx.fillRect(0,0,960,600);
      ctx.fillStyle='#54687f'; ctx.font='22px sans-serif'; ctx.textAlign='center';
      ctx.fillText('请先选择图片', 480, 300);
      bd.querySelector('#simInfo').textContent = '无输入图像'; return; }
    drawBase(ctx, r.grains);
    const defs = r.grains.filter(g=>g.defect);
    ctx.font='13px Consolas,monospace'; ctx.textAlign='left';
    defs.forEach((g,i)=>{
      const conf = (0.82 + Math.random()*0.17);
      ctx.strokeStyle='#f87171'; ctx.lineWidth=2; ctx.shadowColor='#f87171'; ctx.shadowBlur=6;
      ctx.strokeRect(g.x-g.rx-5, g.y-g.ry-5, (g.rx+5)*2, (g.ry+5)*2); ctx.shadowBlur=0;
      ctx.fillStyle='rgba(248,113,113,.9)';
      const label = `异物 ${conf.toFixed(2)}`;
      ctx.fillRect(g.x-g.rx-5, g.y-g.ry-24, ctx.measureText(label).width+10, 18);
      ctx.fillStyle='#180505'; ctx.fillText(label, g.x-g.rx, g.y-g.ry-10);
    });
    bd.querySelector('#simInfo').innerHTML = `推理完成：检出 <b style="color:var(--red)">${defs.length}</b> 个异物目标 · 耗时 ${(18+Math.random()*8).toFixed(0)} ms · 阈值 H${S.th.h}/S${S.th.s}/V${S.th.v}`;
  }
}
$('#btnSim').addEventListener('click', ()=>openSimFor(S.currentModel));

/* SECTION: model manager view */
let mgrSel = null;
function mgrStats(){
  const t = S.models.length;
  const on = S.models.filter(m=>m.status==='使用中').length;
  const pend = S.models.filter(m=>m.status==='待部署'||m.status==='草稿').length;
  const trained = S.models.filter(m=>m.acc>0);
  const avg = trained.length ? (trained.reduce((a,m)=>a+m.acc,0)/trained.length) : 0;
  return [t,on,pend,avg];
}
function openMgr(){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="mgr-view"><div class="mgr-panel frame">
    <div class="modal-head"><h3>推理模型 · 模型管理</h3><span style="font-size:11px;color:var(--dim2);letter-spacing:2px">MODEL REPOSITORY</span><span class="x" data-close>✕</span></div>
    <div class="mgr-stats">
      <div class="metric"><div class="k">模型总数</div><div class="v num" id="mgTotal">0</div></div>
      <div class="metric"><div class="k">使用中</div><div class="v g num" id="mgOn">0</div></div>
      <div class="metric"><div class="k">待部署 / 草稿</div><div class="v num" id="mgPend" style="color:var(--amber)">0</div></div>
      <div class="metric"><div class="k">平均 mAP</div><div class="v num" id="mgAvg">--</div></div>
    </div>
    <div class="mgr-list" id="mgList"></div>
    <div class="mgr-foot">
      <button class="btn" id="mgSim">仿真模型</button>
      <button class="btn" id="mgApply">应用</button>
      <button class="btn" id="mgRename">重命名</button>
      <button class="btn btn-danger" id="mgDel">删除</button>
      <button class="btn" id="mgExport">导出</button>
      <button class="btn" id="mgImport">导入</button>
      <button class="btn" id="mgRefresh">刷新</button>
      <button class="btn btn-primary" id="mgBack">返回</button>
    </div>
  </div></div>`;
  const view = root.firstElementChild;
  view.addEventListener('click', e=>{ if(e.target===view || e.target.closest('[data-close]')) root.innerHTML=''; });
  renderMgr();
  function renderMgr(){
    const [t,on,pend,avg] = mgrStats();
    view.querySelector('#mgTotal').textContent = t;
    view.querySelector('#mgOn').textContent = on;
    view.querySelector('#mgPend').textContent = pend;
    view.querySelector('#mgAvg').textContent = avg ? avg.toFixed(1)+'%' : '--';
    const list = view.querySelector('#mgList'); list.innerHTML = '';
    if(!S.models.length){ list.innerHTML = '<div class="mgr-empty">模型库为空 · 点击「导入」或「新建模型」开始</div>'; }
    S.models.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'mgr-row' + (mgrSel===m.name?' sel':'');
      row.innerHTML = `
        <div><div class="nm">${m.name}
          <span class="pill ${m.status==='使用中'?'g':m.status==='草稿'?'a':'c'}">${m.status}</span>
          ${m.name===S.currentModel?'<span class="pill c">当前</span>':''}</div>
          <div class="sub">训练日期 ${m.date} · 设备 YC3568</div></div>
        <div class="cell"><div class="k">EPOCHS</div><div class="v num">${m.epochs||'--'}</div></div>
        <div class="cell"><div class="k">MAP</div><div class="v num" style="color:var(--green)">${m.acc?m.acc.toFixed(1)+'%':'--'}</div></div>
        <div class="cell"><div class="k">MIOU</div><div class="v num">${m.miou?m.miou.toFixed(1)+'%':'--'}</div></div>
        <div class="cell"><div class="k">体积</div><div class="v num">${m.epochs?(2.1+m.acc/40).toFixed(1)+' MB':'--'}</div></div>
        <div class="selmark">${mgrSel===m.name?'● 已选中':'点击选中'}</div>`;
      row.addEventListener('click', ()=>{ mgrSel = (mgrSel===m.name? null : m.name); renderMgr(); });
      list.appendChild(row);
    });
    const need = ['mgSim','mgApply','mgRename','mgDel','mgExport'];
    need.forEach(id=>{ view.querySelector('#'+id).disabled = !mgrSel; });
  }
  view.querySelector('#mgSim').addEventListener('click', ()=>{ if(mgrSel) openSimFor(mgrSel); });
  view.querySelector('#mgApply').addEventListener('click', ()=>{
    if(!mgrSel) return;
    S.currentModel = mgrSel;
    S.models.forEach(m=>{ if(m.status==='使用中') m.status='已归档'; });
    const m = S.models.find(x=>x.name===mgrSel); if(m && m.status!=='草稿') m.status='使用中';
    toast(`模型「${mgrSel}」已应用为当前推理模型`,'ok'); renderMgr();
  });
  view.querySelector('#mgRename').addEventListener('click', ()=>{
    if(!mgrSel) return;
    const m = S.models.find(x=>x.name===mgrSel);
    openModal('重命名模型', `<div class="field"><label>模型名称</label><input type="text" id="mrInput" value="${m.name}"></div>`,
      [{t:'取消'},{t:'保存', primary:true, fn:()=>{ const v=$('#mrInput').value.trim();
        if(!v){ toast('名称不能为空','err'); return false; }
        if(v!==m.name && S.models.some(x=>x.name===v)){ toast('已存在同名模型','err'); return false; }
        if(S.currentModel===m.name) S.currentModel=v;
        m.name=v; mgrSel=v; renderMgr(); toast('重命名已保存','ok'); }}]);
  });
  view.querySelector('#mgDel').addEventListener('click', ()=>{
    if(!mgrSel) return;
    const name = mgrSel;
    openModal('删除模型', `<p style="font-size:13px;color:var(--dim);line-height:1.8">确认删除模型「${name}」？<br>删除后其权重文件将从本机模型库移除${name===S.currentModel?'；当前模型将被清除，需重新应用':''}。</p>`,
      [{t:'取消'},{t:'确认删除', danger:true, fn:()=>{
        S.models = S.models.filter(x=>x.name!==name);
        if(S.currentModel===name) S.currentModel = (S.models.find(m=>m.status==='使用中')||S.models[0]||{name:'--'}).name;
        mgrSel = null; renderMgr(); toast(`模型「${name}」已删除`,'ok'); }}]);
  });
  view.querySelector('#mgExport').addEventListener('click', ()=>{
    if(!mgrSel) return;
    const m = S.models.find(x=>x.name===mgrSel);
    const blob = new Blob([JSON.stringify({model:m.name, epochs:m.epochs, mAP:m.acc, mIoU:m.miou, export:'onnx-int8', device:'YC3568', date:new Date().toISOString()}, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = m.name + '-int8.json'; a.click();
    URL.revokeObjectURL(a.href);
    toast(`「${m.name}」已导出到本地下载目录`,'ok');
  });
  view.querySelector('#mgImport').addEventListener('click', ()=>{
    const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,.onnx,.pth';
    inp.addEventListener('change', ()=>{
      const f = inp.files && inp.files[0]; if(!f) return;
      const name = f.name.replace(/\.(json|onnx|pth)$/i,'');
      if(S.models.some(m=>m.name===name)){ toast('模型库中已存在同名模型','err'); return; }
      S.models.unshift({name, epochs:'—', acc:0, miou:0, date:new Date().toISOString().slice(0,10), status:'待部署'});
      renderMgr(); toast(`模型「${name}」已导入模型库`,'ok');
    });
    inp.click();
  });
  view.querySelector('#mgRefresh').addEventListener('click', ()=>{ renderMgr(); toast('模型库已刷新','info'); });
  view.querySelector('#mgBack').addEventListener('click', ()=>{ $('#modalRoot').innerHTML=''; });
}

let csSub = null, curveTimer = null;
function renderCS(){
  if(curveTimer){ clearInterval(curveTimer); curveTimer = null; }
  const main = $('#csMain');
  $('#csRail').querySelectorAll('[data-cs]').forEach(b=>b.classList.toggle('on', b.dataset.cs===CS.page && !csSub));
  if(csSub){ main.innerHTML = CS_SUB[csSub](); fillMatShots(main); bindSub(); startCurve(); return; }

function startCurve(){
  const wb = $('#wbCurve'), px = $('#pxCurve');
  const cv = wb || px; if(!cv) return;
  let t = 0;
  const draw = ()=>{
    const ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(56,189,248,.14)'; ctx.lineWidth = 1;
    for(let i=1;i<6;i++){ ctx.beginPath(); ctx.moveTo(0,H*i/6); ctx.lineTo(W,H*i/6); ctx.stroke(); }
    const series = wb ? [['#f87171',0],['#34d399',2.1],['#60a5fa',4.2]] : [['#f87171',0],['#34d399',2.1]];
    series.forEach(([col,ph])=>{
      ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.shadowColor = col; ctx.shadowBlur = 5; ctx.beginPath();
      for(let x=0;x<=W;x+=4){
        const y = H*0.5 + Math.sin((x+t*3)/58 + ph)*H*0.16 + Math.sin((x+t*3)/17 + ph*2)*H*0.05;
        x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke(); ctx.shadowBlur = 0;
    });
    if(px){
      const x1 = CS.px.start/1024*W, x2 = CS.px.end/1024*W;
      ctx.fillStyle = 'rgba(34,211,238,.10)'; ctx.fillRect(x1,0,x2-x1,H);
      ctx.strokeStyle = 'var(--cyan)'; ctx.strokeStyle = '#22d3ee'; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(x1,0); ctx.lineTo(x1,H); ctx.moveTo(x2,0); ctx.lineTo(x2,H); ctx.stroke(); ctx.setLineDash([]);
    }
    t++;
  };
  draw();
  curveTimer = setInterval(()=>{ if(wb && CS.wb.paused) return; if(px && CS.px.paused) return; draw(); }, 66);
}
function readNum(id, fb){ const el = document.getElementById(id); const v = parseFloat(el && el.value); return isNaN(v) ? fb : v; }
function bindSteppers(root){
  root.querySelectorAll('[data-st]').forEach(b=>b.addEventListener('click', ()=>{
    const [id, d] = b.dataset.st.split(':');
    const el = document.getElementById(id); if(!el) return;
    let v = parseFloat(el.value) || 0; const dec = (el.value.indexOf('.')>=0) ? 1 : 0;
    v = Math.max(0, v + (+d) * (dec ? 0.1 : 1));
    el.value = dec ? v.toFixed(1) : v;
    el.dispatchEvent(new Event('input'));
  }));
  root.querySelectorAll('[data-chk]').forEach(c=>c.addEventListener('click', ()=>{
    const grp = c.dataset.radio;
    if(grp){ root.querySelectorAll(`[data-radio="${grp}"]`).forEach(x=>x.classList.remove('on')); c.classList.add('on'); }
    else c.classList.toggle('on');
    c.dispatchEvent(new Event('chk'));
  }));
  root.querySelectorAll('[data-seg]').forEach(sg=>sg.addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    sg.dispatchEvent(new Event('seg'));
  }));
}

    else if(k==='vib') csSub = 'vib';

  const pxCh = main.querySelector('[data-seg="pxCh"]'); if(pxCh) pxCh.addEventListener('seg', ()=>{ CS.px.ch = +pxCh.querySelector('.on').dataset.v; renderCS(); });
  on('ccdApply', ()=>toast('CCD 设置已应用，需重启相机板生效','ok'));
  on('lensApply', ()=>toast('镜头偏置已应用','ok'));
  main.querySelectorAll('[data-lang]').forEach(r=>r.addEventListener('click', ()=>{ CS.lang = r.dataset.lang; renderCS(); }));
  on('langApply', ()=>toast('界面语言已切换为 ' + CS.lang + '（原型演示）','ok'));
  on('smIn', ()=>toast('图像已导入智能分析队列（原型演示）','info'));
  on('smOut', ()=>toast('分析图像已导出到本地下载目录','ok'));

  const smCopy = main.querySelector('[data-chk="smCopy"]'); if(smCopy) smCopy.addEventListener('chk', ()=>CS.smart.copy = smCopy.classList.contains('on'));
  const smH = main.querySelector('[data-chk="smH"]'), smL = main.querySelector('[data-chk="smL"]');
  if(smH) smH.addEventListener('chk', ()=>{ if(smH.classList.contains('on')){ CS.smart.speed='high'; if(smL) smL.classList.remove('on'); } });
  if(smL) smL.addEventListener('chk', ()=>{ if(smL.classList.contains('on')){ CS.smart.speed='low'; if(smH) smH.classList.remove('on'); } });

function setMode(m){
  if(curveTimer){ clearInterval(curveTimer); curveTimer = null; }
  document.body.classList.toggle('mode-classic', m==='classic');
  document.querySelectorAll('#modeSeg .seg').forEach(s=>s.classList.toggle('active', s.dataset.mode===m));
  $('#wsDL').classList.toggle('active', m==='dl');
  $('#wsClassic').classList.toggle('active', m==='classic');
  $('#dockClassic').style.display = m==='classic' ? 'flex' : 'none';
  $('#dockDL').style.display = m==='classic' ? 'none' : 'flex';
  $('#dockVer').textContent = m==='classic' ? 'CS-HMI v323 · YC3568 EDGE' : 'DL-CONSOLE v3.2 · EDGE RUNTIME';
  if(m==='classic'){ csSub = null; renderCS(); }
}
document.querySelectorAll('#modeSeg .seg').forEach(s=>s.addEventListener('click', ()=>setMode(s.dataset.mode)));

/* top system actions */
function bootOverlay(steps, done){
  const el = document.createElement('div'); el.className = 'boot';
  el.innerHTML = `<div class="ring2"></div><h2 id="bootTitle">系统初始化中，请稍候…</h2>
    <div class="steps">${steps.map(s=>`<div class="st" data-s="${s}"><span>${s}</span><span class="r">等待</span></div>`).join('')}</div>
    <p>COLOR SORTER · YC3568 · EDGE RUNTIME</p>`;
  document.body.appendChild(el);
  let i = 0;
  const tick = ()=>{
    if(i>0){ const prev = el.querySelector(`[data-s="${steps[i-1]}"]`); prev.classList.replace('doing','done'); prev.querySelector('.r').textContent = '完成'; }
    if(i>=steps.length){ setTimeout(()=>{ el.remove(); done && done(); }, 420); return; }
    const cur = el.querySelector(`[data-s="${steps[i]}"]`); cur.classList.add('doing'); cur.querySelector('.r').textContent = '进行中';
    if(i===0) el.querySelector('#bootTitle').textContent = '系统初始化中，请稍候…';
    else el.querySelector('#bootTitle').textContent = '通信中，请稍候…';
    i++; setTimeout(tick, 620);
  };
  tick();
}
$('#btnCam').addEventListener('click', ()=>{
  const bd = openModal('视频采集 · 四目实时', `<div class="camgrid">
      ${[1,2,3,4].map(i=>`<div class="cam"><canvas id="cam${i}" width="480" height="300"></canvas><span class="tag">CAM ${i} · ${i<=2?'前视':'后视'}</span></div>`).join('')}
    </div><p style="margin-top:10px;font-size:12px;color:var(--dim)">采集分辨率 2048 × 128 · 行频 3.8 kHz（演示为合成画面）</p>`, [{t:'关闭'}], true);
  let t = 0;
  const timers = [];
  const drawCam = (cv, ph)=>{
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#060b13'; ctx.fillRect(0,0,480,300);
    for(let k=0;k<26;k++){
      const x = ((k*97 + t*(2+ph)) % 520) - 20, y = 40 + (k*53)%220;
      ctx.fillStyle = k%7===0 ? '#7c4a2d' : '#d8cdb4';
      ctx.beginPath(); ctx.ellipse(x, y, 7, 5, k, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(34,211,238,.25)'; ctx.strokeRect(4,4,472,292);
  };
  const loop = ()=>{ [1,2,3,4].forEach(i=>{ const cv = bd.querySelector('#cam'+i); if(cv) drawCam(cv, i); }); t++; };
  loop();
  const iv = setInterval(()=>{ if(!document.body.contains(bd)){ clearInterval(iv); return; } loop(); }, 90);
});
